version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Order matters: a dependency matches the first group it qualifies for.
    # Security-sensitive packages (LLM SDKs, HTTP clients, trading APIs) get
    # their own PR so a malicious patch can't ride along with unrelated bumps.
    groups:
      security-sensitive:
        patterns:
          - "anthropic*"
          - "openai*"
          - "langchain*"
          - "langgraph*"
          - "langsmith*"
          - "alpaca*"
          - "httpx*"
          - "requests*"
          - "aiohttp*"
          - "urllib3*"
          - "exa*"
      python-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      python-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Pin Python language version updates — bumping these breaks the routine env
      - dependency-name: "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
